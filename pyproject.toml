[project]
name = "ads-text-classification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
cpu = ["torch==2.15.0"]
cuda = ["torch==2.15.0"]

[dependency-groups]
train = ["pandas==3.1.1", "openpyxl==3.1.5"]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
default-groups = ["dev", "train"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["Tests"]
